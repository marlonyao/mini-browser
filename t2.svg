<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="white"/>
  <text x="20.0" y="36.3" font-size="19.2" fill="rgb(0,0,0)">Float Layout</text>
  <rect x="20.0" y="20.0" width="120.0" height="120.0" fill="rgb(255,87,34)"/>
  <text x="20.0" y="36.3" font-size="19.2" fill="rgb(255,255,255)">Float Left</text>
  <rect x="660.0" y="20.0" width="120.0" height="120.0" fill="rgb(33,150,243)"/>
  <text x="660.0" y="36.3" font-size="19.2" fill="rgb(255,255,255)">Float Right</text>
  <rect x="20.0" y="39.2" width="760.0" height="39.2" fill="rgb(224,224,224)"/>
  <text x="30.0" y="65.5" font-size="19.2" fill="rgb(0,0,0)">Text flows around the floated boxes above. This demonstrates text wrapping with floats.</text>
  <rect x="20.0" y="140.0" width="760.0" height="39.2" fill="rgb(76,175,80)"/>
  <text x="30.0" y="166.3" font-size="19.2" fill="rgb(255,255,255)">Clear: both (below floats)</text>
</svg>
