<!DOCTYPE html>
<html>
<head><title>T1 - Block & Inline</title></head>
<body style="margin:0; padding:20px;">
  <h1>Block & Inline</h1>
  <p>This is a paragraph with <span style="background:yellow;">inline span</span> inside.</p>
  <div style="width:200px; height:100px; background:#2196F3; color:white; padding:10px;">
    Fixed 200x100 block with padding
  </div>
  <div style="display:inline-block; width:150px; height:50px; background:#4CAF50; color:white;">
    Inline-block 150x50
  </div>
  <span style="background:#FF5722; color:white; padding:5px;">Another inline</span>
</body>
</html>
