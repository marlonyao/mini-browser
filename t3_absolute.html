<!DOCTYPE html>
<html>
<head><title>T3 - Absolute & Fixed</title></head>
<body style="margin:0; padding:20px; position:relative; width:800px; height:400px; background:#f5f5f5;">
  <h1>Absolute & Fixed</h1>
  <div style="position:absolute; top:20px; left:20px; width:150px; height:80px; background:#FF5722; color:white;">
    Top-Left
  </div>
  <div style="position:absolute; top:20px; right:20px; width:150px; height:80px; background:#2196F3; color:white;">
    Top-Right
  </div>
  <div style="position:absolute; bottom:20px; left:20px; width:150px; height:80px; background:#4CAF50; color:white;">
    Bottom-Left
  </div>
  <div style="position:absolute; bottom:20px; right:20px; width:150px; height:80px; background:#FF9800; color:white;">
    Bottom-Right
  </div>
</body>
</html>
