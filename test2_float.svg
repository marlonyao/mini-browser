<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="white"/>
  <text x="0.0" y="16.3" font-size="19.2" fill="rgb(0,0,0)">Float Layout</text>
  <rect x="0.0" y="0.0" width="150.0" height="150.0" fill="rgb(255,87,34)"/>
  <text x="0.0" y="16.3" font-size="19.2" fill="rgb(0,0,0)">Float Left</text>
  <rect x="650.0" y="0.0" width="150.0" height="150.0" fill="rgb(33,150,243)"/>
  <text x="650.0" y="16.3" font-size="19.2" fill="rgb(0,0,0)">Float Right</text>
  <rect x="0.0" y="19.2" width="800.0" height="38.4" fill="rgb(224,224,224)"/>
  <text x="0.0" y="35.5" font-size="19.2" fill="rgb(0,0,0)">This text flows around the floated boxes above.</text>
  <text x="0.0" y="54.7" font-size="19.2" fill="rgb(0,0,0)">More text to demonstrate wrapping behavior with floats.</text>
</svg>
