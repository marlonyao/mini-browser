<!DOCTYPE html>
<html>
<head><title>Test 2 - Float</title></head>
<body style="margin: 0; padding: 20px;">
    <h1>Float Layout</h1>
    <div style="float: left; width: 150px; height: 150px; background: #FF5722; margin-right: 20px;">
        Float Left
    </div>
    <div style="float: right; width: 150px; height: 150px; background: #2196F3; margin-left: 20px;">
        Float Right
    </div>
    <div style="background: #e0e0e0; padding: 10px;">
        <p>This text flows around the floated boxes above.</p>
        <p>More text to demonstrate wrapping behavior with floats.</p>
    </div>
</body>
</html>
