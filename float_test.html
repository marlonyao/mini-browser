<!DOCTYPE html>
<html>
<body style="margin: 0; font-family: sans-serif;">
  <div style="width: 600px; border: 2px solid #333; padding: 10px; margin: 20px;">
    <div style="float: left; width: 150px; height: 100px; background: #ff6b6b; margin: 5px;">Float Left</div>
    <div style="float: right; width: 150px; height: 100px; background: #4ecdc4; margin: 5px;">Float Right</div>
    <div style="background: #ffeaa7; padding: 5px;">
      This text should flow between the two floats.
      It should wrap around the red box on the left and the teal box on the right.
    </div>
    <div style="clear: both; background: #dfe6e9; padding: 5px;">This block clears both floats</div>
  </div>
</body>
</html>
