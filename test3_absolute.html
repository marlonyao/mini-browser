<!DOCTYPE html>
<html>
<head><title>Test 3 - Absolute</title></head>
<body style="margin: 0; padding: 20px; position: relative; width: 800px; height: 400px; background: #f5f5f5;">
    <h1>Absolute Positioning</h1>
    <div style="position: absolute; top: 50px; left: 50px; width: 200px; height: 100px; background: #FF5722;">
        top:50 left:50
    </div>
    <div style="position: absolute; top: 50px; right: 50px; width: 200px; height: 100px; background: #2196F3;">
        top:50 right:50
    </div>
    <div style="position: absolute; bottom: 50px; left: 50px; width: 200px; height: 100px; background: #4CAF50;">
        bottom:50 left:50
    </div>
    <div style="position: absolute; bottom: 50px; right: 50px; width: 200px; height: 100px; background: #FF9800;">
        bottom:50 right:50
    </div>
</body>
</html>
