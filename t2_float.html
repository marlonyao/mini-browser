<!DOCTYPE html>
<html>
<head><title>T2 - Float</title></head>
<body style="margin:0; padding:20px;">
  <h1>Float Layout</h1>
  <div style="float:left; width:120px; height:120px; background:#FF5722; margin-right:15px; color:white;">
    Float Left
  </div>
  <div style="float:right; width:120px; height:120px; background:#2196F3; margin-left:15px; color:white;">
    Float Right
  </div>
  <p style="background:#e0e0e0; padding:10px;">
    Text flows around the floated boxes above. This demonstrates text wrapping with floats.
  </p>
  <div style="clear:both; background:#4CAF50; color:white; padding:10px;">
    Clear: both (below floats)
  </div>
</body>
</html>
